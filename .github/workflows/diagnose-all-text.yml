name: Diagnose text validator

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    name: Capture validator output
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.result.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run validator and capture output
        id: result
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          result = subprocess.run(
              ["python3", "scripts/check-text-hygiene.py"],
              capture_output=True,
              text=True,
          )
          lines = [line.strip() for line in result.stderr.splitlines() if line.strip()]
          if not lines:
              lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          if not lines:
              lines = [f"validator return code {result.returncode}"]
          messages = [line[:180] for line in lines]
          print("matrix=" + json.dumps({"message": messages}, separators=(",", ":")))
          PY

  report:
    name: Validator says ${{ matrix.message }}
    needs: capture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.capture.outputs.matrix) }}
    steps:
      - name: Report captured line
        run: echo "${{ matrix.message }}"
