name: Diagnose all text hygiene

on:
  pull_request:

permissions:
  contents: read

jobs:
  list:
    name: List checked files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.files.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build file matrix
        id: files
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          raw = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout
          paths = [
              item.decode("utf-8")
              for item in raw.split(b"\0")
              if item and item.decode("utf-8").lower().endswith((".md", ".yml", ".yaml"))
          ]
          print("matrix=" + json.dumps({"path": paths}, separators=(",", ":")))
          PY

  check:
    name: Check ${{ matrix.path }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check selected file
        env:
          TARGET: ${{ matrix.path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET"])
          raw = path.read_bytes()
          failures = []
          if b"\0" in raw:
              failures.append("contains a NUL byte")
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError as exc:
              failures.append(f"invalid UTF-8: {exc}")
              text = ""
          if text and not text.endswith("\n"):
              failures.append("missing final newline")
          for number, line in enumerate(text.splitlines(), start=1):
              if line.rstrip(" \t") != line:
                  failures.append(f"line {number}: trailing whitespace")
          if failures:
              raise SystemExit("; ".join(failures))
          print(f"passed: {path}")
          PY
