name: Diagnose all text hygiene

on:
  pull_request:

permissions:
  contents: read

jobs:
  list:
    name: Find failing files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.files.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build failing-file matrix
        id: files
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          from pathlib import Path

          raw = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout
          failures = []
          for item in raw.split(b"\0"):
              if not item:
                  continue
              path = Path(item.decode("utf-8"))
              if path.suffix.lower() not in {".md", ".yml", ".yaml"}:
                  continue
              content = path.read_bytes()
              failed = b"\0" in content
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  failed = True
                  text = ""
              if text and not text.endswith("\n"):
                  failed = True
              if any(line.rstrip(" \t") != line for line in text.splitlines()):
                  failed = True
              if failed:
                  failures.append(str(path))
          print("matrix=" + json.dumps({"path": failures}, separators=(",", ":")))
          PY

  check:
    name: Failing file ${{ matrix.path }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - name: Report failing file
        run: echo "Text hygiene failed for ${{ matrix.path }}"
